<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvisiText — 零宽字符隐写工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Roboto", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fafafa;
    color: #212121;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1a73e8;
    color: #fff;
    padding: 20px 24px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  header h1 { font-size: 22px; font-weight: 500; }
  header p { font-size: 13px; opacity: .85; margin-top: 4px; }
  main {
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 500;
    color: #1a73e8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid #bdbdbd;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: #1a73e8; box-shadow: 0 0 0 1px #1a73e8; }
  .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: #1a73e8;
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 14px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .5px;
    transition: background .2s;
  }
  button:hover { background: #1765cc; }
  button.ghost { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
  button.ghost:hover { background: #e8f0fe; }
  .output {
    background: #f5f5f5;
    border: 1px dashed #bdbdbd;
    padding: 12px;
    margin-top: 12px;
    font-size: 14px;
    word-break: break-all;
    min-height: 48px;
    white-space: pre-wrap;
  }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .msg.ok { color: #188038; }
  .msg.err { color: #d93025; }
  footer {
    text-align: center;
    font-size: 12px;
    color: #757575;
    padding: 16px;
    border-top: 1px solid #e0e0e0;
  }
  footer a { color: #1a73e8; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>InvisiText</h1>
  <p>把秘密藏进看不见的地方 —— 零宽字符隐写工具</p>
</header>
<main>
  <div class="card">
    <h2>编码 · 藏入密文</h2>
    <textarea id="coverText" placeholder="载体文字（别人看到的表面内容），例如：今天天气真好"></textarea>
    <textarea id="secretText" placeholder="秘密信息（真正想藏的内容）" style="margin-top:10px"></textarea>
    <div class="row">
      <button onclick="encode()">生成隐写文本</button>
      <button class="ghost" onclick="copyResult('encodeOut')">复制结果</button>
    </div>
    <div class="output" id="encodeOut">（结果会显示在这里，复制后可直接发送）</div>
    <div class="msg" id="encodeMsg"></div>
  </div>

  <div class="card">
    <h2>解码 · 读取密文</h2>
    <textarea id="decodeIn" placeholder="粘贴收到的隐写文本"></textarea>
    <div class="row">
      <button onclick="decode()">解码</button>
      <button class="ghost" onclick="copyResult('decodeOut')">复制结果</button>
    </div>
    <div class="output" id="decodeOut">（解码结果会显示在这里）</div>
    <div class="msg" id="decodeMsg"></div>
  </div>
</main>
<footer>
  InvisiText · MIT License · <a href="https://github.com/">GitHub</a>
</footer>

<script>
// 零宽字符映射：U+200B = 0, U+200C = 1，U+200D 作为分隔符
const Z0 = "\u200B", Z1 = "\u200C", SEP = "\u200D";

function textToBits(str) {
  const bytes = new TextEncoder().encode(str);
  let bits = "";
  for (const b of bytes) bits += b.toString(2).padStart(8, "0");
  return bits;
}
function bitsToText(bits) {
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
  return new TextDecoder().decode(new Uint8Array(bytes));
}

function encode() {
  const cover = document.getElementById("coverText").value;
  const secret = document.getElementById("secretText").value;
  const msg = document.getElementById("encodeMsg");
  if (!cover || !secret) { msg.className = "msg err"; msg.textContent = "请同时填写载体文字和秘密信息"; return; }
  const bits = textToBits(secret);
  const hidden = bits.split("").map(b => b === "0" ? Z0 : Z1).join("");
  // 将密文嵌入载体第一个字符之后
  const out = cover.slice(0, 1) + SEP + hidden + SEP + cover.slice(1);
  document.getElementById("encodeOut").textContent = out;
  msg.className = "msg ok";
  msg.textContent = "已生成，密文共 " + bits.length + " 位，完全不可见";
}

function decode() {
  const input = document.getElementById("decodeIn").value;
  const msg = document.getElementById("decodeMsg");
  const parts = input.split(SEP);
  if (parts.length < 3 || !parts[1]) { msg.className = "msg err"; msg.textContent = "未检测到隐写内容"; return; }
  const bits = parts[1].split("").map(c => c === Z0 ? "0" : c === Z1 ? "1" : "").join("");
  if (!bits || bits.length % 8 !== 0) { msg.className = "msg err"; msg.textContent = "隐写数据损坏"; return; }
  try {
    document.getElementById("decodeOut").textContent = bitsToText(bits);
    msg.className = "msg ok"; msg.textContent = "解码成功";
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "解码失败：" + e.message;
  }
}

function copyResult(id) {
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById(id === "encodeOut" ? "encodeMsg" : "decodeMsg");
    msg.className = "msg ok"; msg.textContent = "已复制到剪贴板";
  });
}
</script>
</body>
</html>
